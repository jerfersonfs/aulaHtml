<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio form</title>
    <link rel="stylesheet" href="desafio.css">
</head>
<body>
    <div class="form">
        <br><br>
        <form action="#" method="post" id="formulario">
            <p>Inscrição Hipercurso do Prof. Júnior</p>
            <label for="nome">Nome completo:</label>  
            <br>  
            <input type="text" id="nome">
            <br><br>

            <label for="text">E-mail</label>
            <br>
            <input type="email" id="email">
            <br><br>
            <label for="escolaridade">Escolaridade:</label>
            <br>
            <select name="escolaridade">
            <br>
                <option value="em">Ensino Médio</option>
                <option value="nt">Nível Técnico</option>
                <option value="ns">Nível Superior</option>
            </select>
            <br><br>
            <label for="periodo">Periodo de estudo preferido:</label>
            <br>
                <input type="radio" name="periodo">Manhã
                <input type="radio" name="periodo">Tarde
                <input type="radio" name="periodo">Noite
            <br><br>
            <label for="curso">Curso desejado:</label>
            <br>
                <input type="radio" name="curso">Python
                <input type="radio" name="curso">HTML e CSS
                <input type="radio" name="curso">PHP e MySQL
                <input type="radio" name="curso">Github
            <br><br>
            <label for="desejo">Por que deseja fazer esse curso?</label>
            <br>
            <textarea name="desejo" id="desejo/"></textarea>
             <br><br>
                <label for="login">Criação de login</label>
                <br><br>
                <label for="usuario">Usuário:</label>
                <br>
                <input type="text" name="usuario">
                <br>
                <label for="senha">Senha:</label>
                <br>
                <input type="password">
                <br>
            <input type="submit">
        </form>
    </div>
</body>
</html>
